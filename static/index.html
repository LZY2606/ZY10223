<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>压降译井台</title>
<style>
  :root {
    --bg:#0f141b; --panel:#161d27; --ink:#e7edf5; --muted:#93a1b3;
    --line:#28323f; --accent:#4da3ff; --warn:#ffb454; --bad:#ff6b6b;
    --ok:#5dd39e; --violet:#b18cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:2px; }
  header .meta { color:var(--muted); font-size:12px; }
  .wrap { display:grid; grid-template-columns:1fr 320px; gap:12px;
    padding:12px; }
  .charts { display:grid; grid-template-rows:200px 200px 320px; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; }
  .card h2 { font-size:12px; margin:0 0 4px; color:var(--muted);
    font-weight:600; letter-spacing:1px; }
  svg { width:100%; height:calc(100% - 18px); display:block; }
  .side { display:flex; flex-direction:column; gap:12px; }
  .side .card { padding:12px; }
  label { display:block; font-size:11px; color:var(--muted); margin:6px 0 2px; }
  input, select, button {
    background:#0e141c; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:12px; width:100%; }
  button { cursor:pointer; margin-top:8px; }
  button.primary { background:var(--accent); color:#08121f; border-color:var(--accent);
    font-weight:600; }
  button.warn { background:#3a2a14; color:var(--warn); border-color:#5a4220; }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:11px; border:1px solid var(--line); border-radius:20px;
    padding:2px 9px; color:var(--muted); }
  .chip.ok { color:var(--ok); border-color:#27513d; }
  .chip.warn { color:var(--warn); border-color:#5a4220; }
  .chip.bad { color:var(--bad); border-color:#5a2a2a; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th, td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .scroll { max-height:170px; overflow:auto; }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:3px; margin-right:4px;
    vertical-align:middle; }
  .toast { position:fixed; right:16px; bottom:16px; background:#1d2a1a;
    border:1px solid #355c31; color:var(--ok); padding:10px 14px;
    border-radius:8px; display:none; max-width:340px; }
  .muted { color:var(--muted); }
  .seg { cursor:pointer; }
  .seg:hover { fill:#263242; }
</style>
</head>
<body>
<header>
  <h1>压降译井台</h1>
  <span class="meta" id="meta">加载中…</span>
  <span style="flex:1"></span>
  <span class="legend">
    <span><i style="background:#4da3ff"></i>压力/Δp</span>
    <span><i style="background:#ffb454"></i>对数导数</span>
    <span><i style="background:#5dd39e"></i>流量</span>
    <span><i style="background:#ff6b6b"></i>换档</span>
  </span>
</header>
<div class="wrap">
  <div class="charts">
    <div class="card"><h2>流量历史（右连续台阶）</h2><svg id="rateChart"></svg></div>
    <div class="card"><h2>压力历史（原始读数，红点为换档分段）</h2><svg id="pressChart"></svg></div>
    <div class="card"><h2>双对数诊断：Δp 与对数导数（实际时间坐标；按等效时间横轴）</h2><svg id="logChart"></svg></div>
  </div>
  <div class="side">
    <div class="card">
      <h2>数据口径与诊断</h2>
      <div class="chips" id="diag"></div>
    </div>
    <div class="card">
      <h2>修正一个流量阶段</h2>
      <div class="row">
        <div><label>时刻 t (h)</label><input id="rateTime" type="number" step="any" value="200"></div>
        <div><label>流量 (m³/d)</label><input id="rateVal" type="number" step="any" value="200"></div>
      </div>
      <button class="primary" id="rateBtn">提交流量修订（生成新版本）</button>
    </div>
    <div class="card">
      <h2>标出仪器换档</h2>
      <div class="row">
        <div><label>换档时刻 (h)</label><input id="shiftTime" type="number" step="any" value="48"></div>
        <div><label>已知跳变 kPa（可空=自动估计）</label><input id="shiftOff" type="number" step="any" placeholder="自动"></div>
      </div>
      <button class="warn" id="shiftBtn">标记/标定换档分段</button>
    </div>
    <div class="card">
      <h2>区段方案（并排、不覆盖原始读数）</h2>
      <div class="row">
        <div><label>新方案名</label><input id="schemeName" value="方案A"></div>
        <div style="flex:0 0 70px"><label>平滑 L</label><input id="schemeL" type="number" step="0.05" value="0"></div>
      </div>
      <label>锁定径向平台斜率 m′（kPa/对数周期，可空＝自动拟合）</label>
      <input id="lockedPlateau" type="number" step="any" placeholder="例如 11.0">
      <button class="primary" id="schemeBtn">新建方案并加入候选区段</button>
      <div class="scroll" id="schemeBox"></div>
    </div>
    <div class="card">
      <h2>运行指纹 / 导出 / 复核</h2>
      <label>运行标签</label><input id="runLabel" value="当前解释">
      <button class="primary" id="runBtn">冻结运行（含流量修订版本）</button>
      <div class="row">
        <button id="exportBtn">导出 JSON</button>
        <button class="warn" id="resetBtn">清空并重导 fixture</button>
      </div>
      <div class="scroll" id="runBox" style="margin-top:6px"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
